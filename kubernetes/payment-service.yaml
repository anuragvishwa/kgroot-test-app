apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: buglab
  labels:
    app: payment-service
    team: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: payment-service:latest
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            # BUG: Memory limit too low for payment history loading
            # Causes OOMKilled when processing high volume
            memory: "128Mi"
            cpu: "200m"
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: CACHE_ENABLED
          value: "true"
        # BUG: No CACHE_MAX_SIZE set - cache grows unbounded
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: buglab
spec:
  selector:
    app: payment-service
  ports:
  - port: 80
    targetPort: 8081
  type: ClusterIP
