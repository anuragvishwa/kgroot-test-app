apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: buglab
  labels:
    app: payment-service
    team: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        # Using python:3.11-slim to simulate the bug
        image: python:3.11-slim
        # BUG: Allocates too much memory, causing OOMKilled
        command:
          - python
          - -c
          - |
            import time
            print("Starting payment-service...")
            print("Loading payment cache (this will OOMKill)...")
            # Simulate unbounded cache that causes OOMKilled
            cache = []
            for i in range(1000):
                # Each iteration adds ~1MB
                cache.append("x" * 1000000)
                if i % 10 == 0:
                    print(f"Cache size: {len(cache)} MB")
            print("Cache loaded")
            while True:
                time.sleep(60)
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            # BUG: Memory limit too low for the cache
            # This causes OOMKilled
            memory: "64Mi"
            cpu: "200m"
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: CACHE_ENABLED
          value: "true"
        # BUG: No CACHE_MAX_SIZE set - cache grows unbounded
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: buglab
spec:
  selector:
    app: payment-service
  ports:
  - port: 80
    targetPort: 8081
  type: ClusterIP
