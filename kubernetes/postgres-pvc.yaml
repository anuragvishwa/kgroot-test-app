apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: buglab
spec:
  accessModes:
    - ReadWriteOnce
  # BUG: StorageClass "premium-ssd" likely doesn't exist in most clusters
  storageClassName: premium-ssd-nonexistent
  resources:
    requests:
      storage: 10Gi
# This PVC will stay in Pending state because the StorageClass doesn't exist
# FIX: Use an existing StorageClass like "standard", "gp2", or "default"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: buglab
  labels:
    app: postgres
    team: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:14-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "appdb"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-data  # References the PVC above that will be Pending
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: buglab
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
