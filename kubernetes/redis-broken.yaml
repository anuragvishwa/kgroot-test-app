apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: buglab
  labels:
    app: redis  # BUG: Label mismatch with service selector
    team: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis  # Pod has "app: redis"
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: buglab
spec:
  selector:
    app: redis-master  # BUG: Selector "redis-master" doesn't match pod label "redis"
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
# FIX: Change selector to "app: redis" to match pod labels
