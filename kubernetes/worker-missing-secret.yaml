apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: buglab
  labels:
    app: worker
    team: background
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: python:3.11-slim
        command:
          - python
          - -c
          - |
            import os
            import time
            print("Starting background worker...")
            api_key = os.environ.get("API_KEY")
            print(f"Using API key: {api_key[:4]}..." if api_key else "No API key!")
            while True:
                print("Processing jobs...")
                time.sleep(30)
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        # BUG: References secret "worker-secrets" which doesn't exist
        envFrom:
        - secretRef:
            name: worker-secrets  # BUG: This secret doesn't exist!
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: buglab
spec:
  selector:
    app: worker
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
