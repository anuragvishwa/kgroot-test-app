apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: buglab
  labels:
    app: notification-service
    team: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        # BUG: Image tag doesn't exist in registry
        image: gcr.io/myproject/notification-service:v2.1.0-nonexistent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        env:
        - name: LOG_LEVEL
          value: "INFO"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: buglab
spec:
  selector:
    app: notification-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
# This will cause ImagePullBackOff because the image doesn't exist
# FIX: Use a valid image like python:3.11-slim or push the real image
