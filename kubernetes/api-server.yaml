apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: buglab
  labels:
    app: api-server
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: api-server
        # Using python:3.11-slim to simulate the bug
        image: python:3.11-slim
        # BUG: Crashes because DATABASE_URL is not set
        command:
          - python
          - -c
          - |
            import os
            import time
            print("Starting api-server...")
            db_url = os.environ.get("DATABASE_URL")
            if not db_url:
                raise Exception("DATABASE_URL not configured - readiness check failed")
            print(f"Connected to {db_url}")
            while True:
                time.sleep(60)
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        env:
        # BUG: DATABASE_URL not set - causes crash on startup
        # Uncomment below to fix:
        # - name: DATABASE_URL
        #   value: "postgresql://db:5432/app"
        - name: LOG_LEVEL
          value: "INFO"
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: buglab
spec:
  selector:
    app: api-server
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
